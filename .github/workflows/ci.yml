name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm pack smoke
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          rm -rf ci-pack ci-smoke
          mkdir -p ci-pack ci-smoke
          tar -xzf tagreceipt-*.tgz -C ci-pack
          node ci-pack/package/dist/cli/index.js --help
          node ci-pack/package/dist/cli/index.js --version
          cd ci-smoke
          printf '%s\n' '{"name":"tr-smoke","private":true}' > package.json
          npm install ../tagreceipt-*.tgz
          npx tagreceipt --help

  e2e-chromium:
    name: Chromium file:// E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
